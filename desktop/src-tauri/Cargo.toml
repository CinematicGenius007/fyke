[package]
name = "fyke-app"
version = "0.0.0"
description = "Fyke for Windows and Linux"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "fyke_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["unstable"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.9"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "=1.2.1"
webview2-com = "=0.39.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
