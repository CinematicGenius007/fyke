# Builds and tests Fyke where it ships. Zig is downloaded from ziglang.org and checked
# against the SHA-256 it publishes, so the compiler is the pinned release and nothing else.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.1"

jobs:
  windows:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e") { throw "Zig checksum mismatch: $hash" }
          $target = Join-Path $env:RUNNER_TEMP "zig"
          Expand-Archive $zip -DestinationPath $target
          Add-Content $env:GITHUB_PATH (Get-ChildItem $target -Directory | Select-Object -First 1).FullName

      - run: zig version
      - run: zig build test
      - run: zig build -Drelease

      # Each script is its own step, so that one failure does not hide the others.
      - name: e2e
        if: ${{ !cancelled() }}
        run: python tools/e2e.py zig-out/bin/fyke.exe
      - name: e2e_daemon
        if: ${{ !cancelled() }}
        run: python tools/e2e_daemon.py zig-out/bin/fyke.exe
      - name: e2e_mcp
        if: ${{ !cancelled() }}
        run: python tools/e2e_mcp.py zig-out/bin/fyke.exe
      - name: e2e_features
        if: ${{ !cancelled() }}
        run: python tools/e2e_features.py zig-out/bin/fyke.exe
      - name: e2e_service
        if: ${{ !cancelled() }}
        run: python tools/e2e_service_windows.py zig-out/bin/fyke.exe
      # The terminal reader runs in a Windows pseudo-console (ConPTY), through pywinpty.
      - name: Install terminal test dependencies
        if: ${{ !cancelled() }}
        run: python -m pip install pyte pywinpty
      - name: e2e_tui
        if: ${{ !cancelled() }}
        run: python tools/e2e_tui.py zig-out/bin/fyke.exe

  linux:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - run: zig fmt --check src tools build.zig
      - run: zig build test
      - run: zig build -Drelease
      - name: Python test dependencies
        run: python3 -m pip install pyte
      - name: e2e
        if: ${{ !cancelled() }}
        run: python3 tools/e2e.py zig-out/bin/fyke
      - name: e2e_daemon
        if: ${{ !cancelled() }}
        run: python3 tools/e2e_daemon.py zig-out/bin/fyke
      - name: e2e_mcp
        if: ${{ !cancelled() }}
        run: python3 tools/e2e_mcp.py zig-out/bin/fyke
      - name: e2e_features
        if: ${{ !cancelled() }}
        run: python3 tools/e2e_features.py zig-out/bin/fyke
      - name: e2e_service
        if: ${{ !cancelled() }}
        run: python3 tools/e2e_service.py zig-out/bin/fyke
      - name: e2e_tui
        if: ${{ !cancelled() }}
        run: python3 tools/e2e_tui.py zig-out/bin/fyke

  # The Windows GUI's library and view-model tests. They need no Windows, so they run on both
  # systems: a bug that only the Unix socket on one of them shows is found here. Pull requests run
  # them only when gui-windows/ changed; pushes to main and the release workflow always do.
  windows-dotnet:
    name: windows-dotnet (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did gui-windows change?
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -q '^gui-windows/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "gui-windows/ is unchanged, so its tests are skipped."
          fi

      # The SDK version is the one in gui-windows/global.json.
      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.run == 'true'
        with:
          global-json-file: gui-windows/global.json

      - name: Client tests
        if: steps.gate.outputs.run == 'true'
        run: dotnet test gui-windows/tests/Fyke.Client.Tests -c Release
      - name: View-model tests
        if: ${{ steps.gate.outputs.run == 'true' && !cancelled() }}
        run: dotnet test gui-windows/tests/Fyke.ViewModels.Tests -c Release
      # The WinUI app only builds on Windows, so this is where it is first compiled.
      - name: Build the app
        if: ${{ steps.gate.outputs.run == 'true' && matrix.os == 'windows-latest' && !cancelled() }}
        run: dotnet build gui-windows/src/Fyke.App -c Release -p:Platform=x64
      # The XAML compiler's own messages do not reach the normal build log.
      - name: XAML compiler diagnostics
        if: ${{ failure() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          dotnet build gui-windows/src/Fyke.App -c Release -p:Platform=x64 -v:diag > xaml.log
          Select-String -Path xaml.log -Pattern 'WMC|XLS|XamlCompiler|error ' | Select-Object -First 60 | ForEach-Object { $_.Line.Trim() }
          Get-ChildItem gui-windows/src/Fyke.App/obj -Recurse -Include input.json,output.json | ForEach-Object { $_.FullName }
